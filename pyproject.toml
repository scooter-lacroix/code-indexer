[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-index-mcp"
version = "2.0.0"
description = "Code indexing and analysis tools for LLMs using MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "scooter-lacroix"}
]
dependencies = [
    "alembic>=1.16.4",
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.0",
    "elasticsearch>=8.11.0,<9.0.0",
    "mcp>=0.3.0",
    "pdfminer-six>=20250506",
    "pika>=1.3.2",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "pytest>=8.4.1",
    "python-docx>=1.2.0",
    "python-json-logger==2.0.7",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "lxml>=6.0.0",
    "cffi>=1.17.0",
    "charset-normalizer>=3.4.0",
    "cryptography>=45.0.0",
    "pycparser>=2.22",
    "six>=1.17.0",
    "python-dateutil>=2.9.0",
    "urllib3>=2.5.0",
    "elastic-transport>=8.17.0",
    "greenlet>=3.2.0",
    "mako>=1.3.0",
    "markupsafe>=3.0.0",
    "httpx>=0.28.1",
    "faiss-cpu>=1.7.4",
    # CPU-only sentence-transformers - exclude GPU/CUDA dependencies
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0,<2.5",  # Pin to stable CPU-compatible versions
    "numpy>=1.24.0",
    "pytest-asyncio>=1.3.0",
]

# CRITICAL: CPU-only configuration - prevent CUDA/GPU packages
# This system is CPU/AMD-only and must NOT install NVIDIA packages
[tool.uv]
no-build-isolation = false
# Use CPU-only PyTorch index as PRIMARY source
# DO NOT add PyPI as extra-index-url - it provides GPU packages
index-url = "https://download.pytorch.org/whl/cpu"

# Explicitly block ALL GPU/CUDA packages using constraint-dependencies
constraint-dependencies = [
    # Block FAISS GPU variant (use ==0.0.0 to make it unsatisfiable)
    "faiss-gpu==0.0.0",
    # Block NVIDIA CUDA runtime packages
    "nvidia-cuda-runtime-cu12==0.0.0",
    "nvidia-cudnn-cu12==0.0.0",
    "nvidia-cublas-cu12==0.0.0",
    "nvidia-cufft-cu12==0.0.0",
    "nvidia-curand-cu12==0.0.0",
    "nvidia-cusolver-cu12==0.0.0",
    "nvidia-cusparse-cu12==0.0.0",
]

# Ensure CPU-only FAISS variant by explicitly requiring it
override-dependencies = [
    "faiss-cpu>=1.7.4",
]

[project.urls]
Homepage = "https://github.com/scooter-lacroix/code-indexer"
"Bug Tracker" = "https://github.com/scooter-lacroix/code-indexer/issues"

[project.scripts]
code-index-mcp = "code_index_mcp.server:main"
code-search = "code_index_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
