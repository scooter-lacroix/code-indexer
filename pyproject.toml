[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-index-mcp"
version = "2.0.0"
description = "Code indexing and analysis tools for LLMs using MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "johnhuang316"}
]
dependencies = [
    "alembic>=1.16.4",
    "elasticsearch==8.10.0",
    "mcp>=0.3.0",
    "pdfminer-six>=20250506",
    "pika>=1.3.2",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "pytest>=8.4.1",
    "python-docx>=1.2.0",
    "python-json-logger==2.0.7",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "lxml>=6.0.0",
    "cffi>=1.17.0",
    "charset-normalizer>=3.4.0",
    "cryptography>=45.0.0",
    "pycparser>=2.22",
    "six>=1.17.0",
    "python-dateutil>=2.9.0",
    "urllib3>=2.5.0",
    "elastic-transport>=8.17.0",
    "greenlet>=3.2.0",
    "mako>=1.3.0",
    "markupsafe>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/johnhuang316/code-index-mcp"
"Bug Tracker" = "https://github.com/johnhuang316/code-index-mcp/issues"

[project.scripts]
code-index-mcp = "code_index_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
